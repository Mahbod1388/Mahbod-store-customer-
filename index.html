<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAHBOD STORE</title><style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#07111f;
    color:#eef6ff;
}

:root{
    --card:#0d1b2e;
    --card2:#10243b;
    --border:#1b3854;
    --blue:#45b7ff;
    --purple:#806cff;
    --muted:#91a6ba;
}

header{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(7,17,31,.94);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--border);
    padding:15px;
}

.nav{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.logo span{
    color:var(--blue);
}

button{
    cursor:pointer;
}

.btn{
    border:none;
    border-radius:11px;
    padding:11px 16px;
    background:linear-gradient(135deg,var(--blue),var(--purple));
    color:#04101c;
    font-weight:bold;
}

.wrap{
    max-width:1100px;
    margin:auto;
    padding:0 18px;
}

/* HERO */

.hero{
    margin:25px auto;
    max-width:1100px;
    padding:35px 25px;
    border:1px solid var(--border);
    border-radius:25px;
    background:
        radial-gradient(circle at 80% 20%,#45b7ff25,transparent 35%),
        linear-gradient(145deg,#0d1d32,#0b1525);
}

.hero h1{
    margin:0 0 10px;
    font-size:32px;
}

.hero p{
    color:var(--muted);
}

/* PRODUCTS */

.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:15px;
    margin-bottom:30px;
}

.product{
    overflow:hidden;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    transition:.2s;
}

.product:hover{
    transform:translateY(-3px);
    border-color:#28628b;
}

.product-image{
    width:100%;
    height:190px;
    object-fit:cover;
    background:#10243b;
    cursor:pointer;
}

.product-content{
    padding:14px;
}

.product-name{
    font-weight:bold;
    font-size:16px;
}

.product-description{
    color:var(--muted);
    font-size:12px;
    margin-top:7px;
    min-height:32px;
}

.price{
    color:var(--blue);
    font-weight:bold;
    margin:10px 0;
}

/* CART */

.cart{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px;
    margin-bottom:30px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--border);
    padding:12px 0;
}

.remove{
    background:#351925;
    color:#ff8094;
    border:1px solid #602839;
    border-radius:8px;
    padding:7px 10px;
}

/* CHECKOUT */

.checkout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

input,
textarea{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#071321;
    color:white;
    outline:none;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.full{
    grid-column:1/-1;
}

/* GALLERY MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(750px,100%);
    max-height:92vh;
    overflow:auto;
    background:#0b192b;
    border:1px solid var(--border);
    border-radius:20px;
    padding:15px;
}

.close{
    float:left;
    background:#142840;
    color:white;
    border:1px solid var(--border);
    border-radius:8px;
    padding:7px 10px;
}

.main-image{
    width:100%;
    max-height:60vh;
    object-fit:contain;
    background:#071321;
    border-radius:12px;
}

.gallery{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-top:10px;
}

.gallery img{
    width:75px;
    height:65px;
    object-fit:cover;
    border-radius:9px;
    cursor:pointer;
    border:2px solid transparent;
}

.gallery img.active{
    border-color:var(--blue);
}

/* CONTACT */

.contact{
    background:linear-gradient(145deg,#0d1d32,#0b1525);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    margin-bottom:30px;
}

.contact-item{
    margin:10px 0;
    color:var(--muted);
}

/* MOBILE */

@media(max-width:650px){

    .hero h1{
        font-size:24px;
    }

    .checkout{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .product-image{
        height:150px;
    }

    .product-content{
        padding:10px;
    }

}
</style></head><body><header><div class="nav"><div class="logo">
MAHBOD <span>STORE</span>
</div><button class="btn"
onclick="document.getElementById('cart').scrollIntoView({behavior:'smooth'})">

🛒 سبد خرید
<span id="cartCount">۰</span>

</button></div></header><section class="hero"><div class="wrap"><h1>
انتخاب‌های خاص، ساده و سریع.
</h1><p>
محصولات منتخب MAHBOD STORE با تجربه‌ای ساده و سریع برای خرید.
</p></div></section><main class="wrap"><h2>
محصولات
</h2><div id="products" class="products"></div><!-- CART --><section id="cart" class="cart"><h2>
🛒 سبد خرید
</h2><div id="cartItems"></div><h3 id="cartTotal">
۰ تومان
</h3><div class="checkout"><input
id="customerName"
placeholder="نام و نام خانوادگی"

«»

<input
id="phone"
placeholder="شماره تماس"

«»

<input
id="postalCode"
placeholder="کد پستی"

«»

<input
id="city"
placeholder="شهر"

«»

<textarea
id="address"
class="full"
placeholder="آدرس کامل"
></textarea><textarea
id="note"
class="full"
placeholder="توضیحات سفارش (اختیاری)"
></textarea><button
class="btn full"
onclick="submitOrder()"

«»

ثبت سفارش

</button></div></section><!-- CONTACT --><section class="contact"><h2>
📞 تماس با ما
</h2><div class="contact-item">
📱 تلفن: 09XXXXXXXXX
</div><div class="contact-item">
💬 پشتیبانی: تلگرام / واتساپ
</div><div class="contact-item">
🕐 ساعات پاسخگویی: هر روز 10 صبح تا 10 شب
</div></section></main><!-- IMAGE VIEWER --><div
id="imageModal"
class="modal"
><div class="modal-box"><button
class="close"
onclick="closeViewer()"

«»

✕
</button>

<img
id="mainImage"
class="main-image"

«»

<div
id="gallery"
class="gallery"
></div></div></div><script>

/*
=================================================
ذخیره محصولات
=================================================

ادمین محصولات را با این کلید ذخیره می‌کند:

mahbod_products_v2

هر محصول می‌تواند چند عکس داشته باشد:

images: [
    "image1",
    "image2",
    "image3"
]

=================================================
*/


let products =
JSON.parse(
localStorage.getItem("mahbod_products_v2") || "[]"
);


let cart = [];


/* پول */

function money(number){

return Number(number || 0)
.toLocaleString("fa-IR")
+ " تومان";

}


/* جلوگیری از HTML خطرناک */

function escapeHTML(text){

return String(text ?? "")
.replace(/[&<>"']/g,function(char){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[char];

});

}


/* نمایش محصولات */

function renderProducts(){

products =
JSON.parse(
localStorage.getItem("mahbod_products_v2") || "[]"
);


const container =
document.getElementById("products");


if(!products.length){

container.innerHTML = `
<div class="cart">
هنوز محصولی برای نمایش وجود ندارد.
</div>
`;

return;

}


container.innerHTML =
products.map(function(product){

const image =
product.images &&
product.images.length
?
product.images[0]
:
"";


return `

<article class="product">

<img
class="product-image"
src="${image}"
onclick="openGallery(${product.id})"
onerror="this.style.visibility='hidden'"
>

<div class="product-content">

<div class="product-name">

${escapeHTML(product.name)}

</div>

<div class="product-description">

${escapeHTML(product.desc || "")}

</div>

<div class="price">

${money(product.price)}

</div>

<button
class="btn"
style="width:100%"
onclick="addToCart(${product.id})"
>

افزودن به سبد

</button>

</div>

</article>

`;

}).join("");

}


/* افزودن به سبد */

function addToCart(id){

const product =
products.find(
p => p.id === id
);


if(!product) return;


const existing =
cart.find(
item => item.id === id
);


if(existing){

existing.quantity++;

}else{

cart.push({

id:id,

quantity:1

});

}


renderCart();

}


/* حذف */

function removeFromCart(id){

cart =
cart.filter(
item => item.id !== id
);

renderCart();

}


/* سبد خرید */

function renderCart(){

const container =
document.getElementById("cartItems");


if(!cart.length){

container.innerHTML =
`
<div style="color:#91a6ba">
سبد خرید خالی است.
</div>
`;

}else{

container.innerHTML =
cart.map(function(item){

const product =
products.find(
p => p.id === item.id
);


if(!product) return "";


return `

<div class="cart-item">

<div>

<b>
${escapeHTML(product.name)}
</b>

<br>

<span style="color:#91a6ba">

${item.quantity} عدد

</span>

</div>

<div>

${money(
product.price * item.quantity
)}

<button
class="remove"
onclick="removeFromCart(${product.id})"
>

حذف

</button>

</div>

</div>

`;

}).join("");

}


const total =
cart.reduce(function(sum,item){

const product =
products.find(
p => p.id === item.id
);

return sum +
(product ? product.price * item.quantity : 0);

},0);


document.getElementById("cartTotal")
.textContent =
money(total);


document.getElementById("cartCount")
.textContent =
cart.reduce(
(sum,item)=>sum+item.quantity,
0
).toLocaleString("fa-IR");

}


/* گالری چند عکس */

function openGallery(id){

const product =
products.find(
p => p.id === id
);


if(!product) return;


const images =
product.images || [];


if(!images.length){

return;

}


const mainImage =
document.getElementById("mainImage");


mainImage.src =
images[0];


const gallery =
document.getElementById("gallery");


gallery.innerHTML =
images.map(function(image,index){

return `

<img
src="${image}"
class="${index === 0 ? "active" : ""}"
onclick="
document.getElementById('mainImage').src=this.src;
document.querySelectorAll('#gallery img')
.forEach(x=>x.classList.remove('active'));
this.classList.add('active');
"
>

`;

}).join("");


document.getElementById("imageModal")
.classList.add("show");

}


function closeViewer(){

document.getElementById("imageModal")
.classList.remove("show");

}


/* ثبت سفارش */

function submitOrder(){

if(!cart.length){

alert("سبد خرید شما خالی است.");

return;

}


const name =
document.getElementById("customerName")
.value.trim();


const phone =
document.getElementById("phone")
.value.trim();


const postalCode =
document.getElementById("postalCode")
.value.trim();


const city =
document.getElementById("city")
.value.trim();


const address =
document.getElementById("address")
.value.trim();


const note =
document.getElementById("note")
.value.trim();


if(
!name ||
!phone ||
!postalCode ||
!city ||
!address
){

alert(
"لطفاً نام، شماره تماس، کد پستی، شهر و آدرس را کامل کنید."
);

return;

}


const total =
cart.reduce(function(sum,item){

const product =
products.find(
p => p.id === item.id
);

return sum +
(product.price * item.quantity);

},0);


const orders =
JSON.parse(
localStorage.getItem("mahbod_orders") || "[]"
);


const order = {

id:Date.now(),

name:name,

phone:phone,

postalCode:postalCode,

city:city,

address:address,

note:note,

items:cart,

total:total,

status:"pending",

date:new Date().toISOString()

};


orders.push(order);


localStorage.setItem(
"mahbod_orders",
JSON.stringify(orders)
);


cart = [];

renderCart();


document.getElementById("customerName").value="";
document.getElementById("phone").value="";
document.getElementById("postalCode").value="";
document.getElementById("city").value="";
document.getElementById("address").value="";
document.getElementById("note").value="";


alert(
"✅ سفارش شما با موفقیت ثبت شد."
);

}


/* شروع */

renderProducts();

renderCart();

</script></body>
</html>
